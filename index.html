
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Go Out With Me? 💖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #ffc2d9, #fff0f5);
    }

    .card {
      width: min(90%, 440px);
      padding: 40px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 28px;
      box-shadow: 0 15px 45px rgba(210, 70, 125, 0.2);
      position: relative;
      z-index: 1;
    }

    .emoji {
      font-size: 65px;
      margin-bottom: 12px;
      animation: heartbeat 1.3s infinite;
    }

    h1 {
      color: #e84378;
      font-size: 30px;
      line-height: 1.35;
      margin: 10px 0;
    }

    p {
      color: #88546b;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      min-height: 55px;
    }

    button {
      border: none;
      padding: 14px 30px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #yesBtn {
      background: #ff4f87;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 79, 135, 0.3);
    }

    #yesBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 22px rgba(255, 79, 135, 0.4);
    }

    #noBtn {
      background: #f1edf0;
      color: #785b6a;
      position: relative;
      z-index: 5;
    }

    #success {
      display: none;
      margin-top: 25px;
      color: #e84378;
      font-size: 23px;
      font-weight: bold;
      line-height: 1.5;
      animation: pop 0.45s ease;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 0;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 32px 18px;
      }

      h1 {
        font-size: 26px;
      }

      button {
        padding: 13px 25px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="emoji">💗</div>

    <h1 id="question">Will you go out with me? 💖</h1>
    <p id="subtitle">I have a little question for you... 🥹</p>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes! 💕</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div id="success">
      Yayyyy! 🥰💖<br />
      I was hoping you'd say yes! 🌹
    </div>
  </main>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const question = document.getElementById("question");
    const subtitle = document.getElementById("subtitle");
    const buttons = document.getElementById("buttons");
    const success = document.getElementById("success");

    function moveNoButton() {
      const margin = 12;

      // Keep the button within the visible screen.
      const maxX = Math.max(
        margin,
        window.innerWidth - noBtn.offsetWidth - margin
      );

      const maxY = Math.max(
        margin,
        window.innerHeight - noBtn.offsetHeight - margin
      );

      const x = margin + Math.random() * (maxX - margin);
      const y = margin + Math.random() * (maxY - margin);

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Make the No button run away when approached.
    noBtn.addEventListener("pointerenter", moveNoButton);

    // Also move it when someone tries to press it on a touchscreen.
    noBtn.addEventListener("touchstart", function (event) {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    noBtn.addEventListener("click", function (event) {
      event.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", function () {
      question.textContent = "You just made me the happiest! 💖";
      subtitle.textContent = "This is going to be so special! 🌸";
      buttons.style.display = "none";
      success.style.display = "block";

      // Celebrate with floating hearts.
      for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 90);
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";

      const symbols = ["💖", "💕", "💗", "💘", "🌸", "✨"];
      heart.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (18 + Math.random() * 24) + "px";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6500);
    }
  </script>
</body>
</html>
